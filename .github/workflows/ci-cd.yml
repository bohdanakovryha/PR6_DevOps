# CI/CD pipeline for the PR6 service.
#
#   pull request -> test -> build                (image is built, not published)
#   push to main -> test -> build+push -> deploy  (deploy with automatic rollback)
#
# Every job depends on the previous one, so a failed test blocks build and deploy.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments of main at the same time; outdated PR runs are cancelled.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  APP_VERSION: "1.0.0"

# Explicit bash enables "-eo pipefail": a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/unit-tests.xml 2>&1 | tee reports/unit-tests.log

      - name: Upload test reports
        if: always()            # keep reports even (especially) when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.sha }}
          path: reports/
          retention-days: 14

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image names
        id: meta
        run: |
          # GHCR requires lowercase repository names.
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "stable=${repo}:stable" >> "$GITHUB_OUTPUT"

      - name: Build image tagged with the commit SHA
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "${{ steps.meta.outputs.image }}" .
          docker image inspect "${{ steps.meta.outputs.image }}" \
            --format 'size={{.Size}} user={{.Config.User}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    name: Deploy to training environment
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Default: GitHub-hosted Ubuntu VM. Set repository variable DEPLOY_RUNNER=self-hosted
    # to deploy to your own training Linux machine with a self-hosted runner.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: training
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      STABLE_IMAGE: ${{ needs.build.outputs.stable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Testinfra
        run: pip install -r requirements-dev.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Restore last known good version
        # A fresh GitHub-hosted VM is empty: start the last image that passed all
        # checks (:stable), so a failed deployment has something to roll back to.
        run: |
          if docker inspect pr6-app >/dev/null 2>&1; then
            echo "Service is already running: $(docker inspect -f '{{.Config.Image}}' pr6-app)"
          elif docker pull "$STABLE_IMAGE"; then
            REPORT_DIR=reports/baseline scripts/deploy.sh "$STABLE_IMAGE"
          else
            echo "No stable image yet - this is the first deployment."
          fi

      - name: Deploy ${{ github.sha }} (automatic rollback on failure)
        run: |
          docker pull "$IMAGE"
          scripts/deploy.sh "$IMAGE"

      - name: HTTP check of the deployed version
        run: |
          python scripts/http_check.py --url http://127.0.0.1:8080/health --timeout 30
          python scripts/http_check.py --url http://127.0.0.1:8080/version --timeout 30 \
            --expect "commit=${GITHUB_SHA}"

      - name: Promote image to :stable
        run: |
          docker tag "$IMAGE" "$STABLE_IMAGE"
          docker push "$STABLE_IMAGE"

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p reports
          docker compose ps -a > reports/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --timestamps > reports/compose-final.log 2>&1 || true

      - name: Upload deployment reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-reports-${{ github.sha }}
          path: reports/
          retention-days: 14